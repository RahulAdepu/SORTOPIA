<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#171B36" />
    <meta name="description" content="Sortopia: The Ultimate Color Sort Challenge. A liquid sorting puzzle by MindGrid Labs Pvt. Ltd." />
    <title>Sortopia: The Ultimate Color Sort Challenge</title>
    <!-- YouTube Playables SDK: MUST load before any game code. It is a no-op outside Playables. -->
    <script src="https://www.youtube.com/game_api/v1"></script>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #171b36;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        display: block;
        touch-action: none;
        outline: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      #boot span {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 4px solid rgba(155, 114, 242, 0.25);
        border-top-color: #ff78b7;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot"><span></span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
