# Nginx site for https://games.mindgridlabs.org. Sortopia is served at /sortopia/
#
# Install:
#   sudo cp games.mindgridlabs.org.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/games.mindgridlabs.org.conf /etc/nginx/sites-enabled/
#   sudo certbot certonly --webroot -w /var/www/letsencrypt -d games.mindgridlabs.org
#   sudo nginx -t && sudo systemctl reload nginx
#
# Layout on disk (atomic releases, see DEPLOYMENT.md):
#   /var/www/games.mindgridlabs.org/sortopia            -> symlink to current release
#   /var/www/games.mindgridlabs.org/releases/sortopia-<sha>/

# HTTP → HTTPS (keeps the ACME challenge reachable for certificate renewals)
server {
    listen 80;
    listen [::]:80;
    server_name games.mindgridlabs.org;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name games.mindgridlabs.org;

    ssl_certificate     /etc/letsencrypt/live/games.mindgridlabs.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/games.mindgridlabs.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/games.mindgridlabs.org;
    index index.html;

    # Security headers. The CSP allows the official YouTube Playables SDK script only.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com/game_api/ https://www.youtube.com/s/ytgame/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'" always;

    # Compression (Playables also compresses on ingestion; this mirrors it for the web build).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = / {
        return 302 /sortopia/;
    }

    location = /sortopia {
        return 301 /sortopia/;
    }

    # Hashed build assets never change, so cache them for a year.
    location ~* ^/sortopia/assets/.+\.(js|css|woff2?|png|svg|json)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The HTML entry point must always be revalidated so new releases load.
    location /sortopia/ {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com/game_api/ https://www.youtube.com/s/ytgame/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'" always;
        try_files $uri $uri/ /sortopia/index.html;
    }

    location ~ /\. {
        deny all;
    }
}
