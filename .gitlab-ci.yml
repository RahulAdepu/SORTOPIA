# Sortopia CI/CD (GitLab)
#
# Stages: verify (typecheck + unit tests + level validation) → build (vite + bundle
# check) → deploy (atomic rsync release to the Nginx host, manual on main).
#
# Required CI/CD variables (Settings → CI/CD → Variables, masked + protected):
#   SSH_PRIVATE_KEY   private key of the deploy user (file or variable)
#   SSH_KNOWN_HOSTS   output of `ssh-keyscan <DEPLOY_HOST>`
#   DEPLOY_HOST       e.g. games.mindgridlabs.org
#   DEPLOY_USER       e.g. deploy
# Optional:
#   DEPLOY_ROOT       defaults to /var/www/games.mindgridlabs.org

stages:
  - verify
  - build
  - deploy

default:
  image: node:22-bookworm-slim
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

verify:
  stage: verify
  script:
    - npm run typecheck
    - npm test
    - npm run levels:validate

build:
  stage: build
  script:
    - npx vite build
    - npm run bundle:check
  artifacts:
    name: "sortopia-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    expire_in: 30 days

# Zip for upload to the YouTube Playables console (relative paths, index.html at root).
package_playables:
  stage: build
  needs: [build]
  before_script: []
  image: alpine:3.20
  script:
    - apk add --no-cache zip
    - cd dist && zip -r -9 "../sortopia-playables-$CI_COMMIT_SHORT_SHA.zip" . && cd ..
  artifacts:
    paths:
      - "sortopia-playables-*.zip"
    expire_in: 90 days

deploy_production:
  stage: deploy
  needs: [build]
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
  script:
    - ROOT="${DEPLOY_ROOT:-/var/www/games.mindgridlabs.org}"
    - RELEASE="$ROOT/releases/sortopia-$CI_COMMIT_SHORT_SHA"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$RELEASE'"
    - rsync -az --delete dist/ "$DEPLOY_USER@$DEPLOY_HOST:$RELEASE/"
    # Atomic switch, then keep the 5 most recent releases.
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "ln -sfn '$RELEASE' '$ROOT/sortopia.next' && mv -Tf '$ROOT/sortopia.next' '$ROOT/sortopia' && ls -1dt $ROOT/releases/sortopia-* | tail -n +6 | xargs -r rm -rf"
    - wget -q --spider "https://$DEPLOY_HOST/sortopia/" && echo "Smoke check OK"
  environment:
    name: production
    url: https://games.mindgridlabs.org/sortopia/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
